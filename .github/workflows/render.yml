name: Render Calculus video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg xvfb \
            libglfw3 libgl1-mesa-glx libgl1-mesa-dri libegl1-mesa mesa-utils \
            pkg-config libcairo2-dev libpango1.0-dev fonts-dejavu \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-science texlive-pictures dvisvgm ghostscript
          sudo apt-get install -y libraqm0 || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stub dsfont.sty (ManimGL template loads it; our math never uses \mathds)
        run: |
          mkdir -p /opt/texstubs
          printf '\\ProvidesPackage{dsfont}\n' > /opt/texstubs/dsfont.sty
          echo "TEXINPUTS=/opt/texstubs//:" >> "$GITHUB_ENV"

      - name: Render video (headless, software OpenGL via xvfb)
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: llvmpipe
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          mkdir -p out
          xvfb-run -a -s "-screen 0 3840x2160x24" \
            manimgl scene.py Calculus -w --uhd --frame_rate 30
          echo "--- produced mp4 files ---"
          find . -name '*.mp4' -print
          vid=$(find . -name 'Calculus.mp4' -print -quit)
          test -n "$vid" || { echo "no mp4 produced"; exit 1; }
          echo "found video: $vid"
          cp "$vid" out/calculus.mp4
          ls -la out

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculus-video
          path: out/calculus.mp4
          if-no-files-found: error

      - name: Attach video to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest out/calculus.mp4 \
            --title "Calculus, explained" \
            --notes "Rendered ManimGL video (auto-built from latest main)." \
            --target main || \
          gh release upload latest out/calculus.mp4 --clobber
